name: Keep Render alive

on:
  schedule:
    # Toutes les 14 minutes — évite la mise en veille Render (plan free, ~15 min)
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 30 https://archoguide.onrender.com/_stcore/health
