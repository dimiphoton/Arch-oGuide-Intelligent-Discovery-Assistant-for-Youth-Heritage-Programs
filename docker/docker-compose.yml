services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ../data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ../data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    profiles:
      - ingest
    command: ["python", "scripts/run_ingest.py"]

volumes:
  qdrant_data:
