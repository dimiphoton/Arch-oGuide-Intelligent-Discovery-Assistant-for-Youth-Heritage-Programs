# Déploiement Render.com — stack tout-en-un (Streamlit + Qdrant embarqué)
# Docs : https://render.com/docs/blueprint-spec

services:
  - type: web
    name: archoguide
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        value: http://127.0.0.1:6333
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /_stcore/health
